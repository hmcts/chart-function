suite: SecretProviderClass tests
templates:
  - templates/secretproviderclass.yaml
tests:
  - it: should not render any SecretProviderClass when keyVaults are not configured
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when global.enableKeyVaults is false (chart default)
    set:
      keyVaults:
        my-vault:
          secrets:
            - name: my-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one SecretProviderClass per vault when enabled
    set:
      global:
        enableKeyVaults: true
        environment: aat
        tenantId: 00000000-0000-0000-0000-000000000000
      keyVaults:
        my-vault:
          secrets:
            - name: my-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretProviderClass

