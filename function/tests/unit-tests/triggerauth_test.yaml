suite: TriggerAuthentication conditional rendering
templates:
  - templates/TriggerAuthentication.yaml
tests:
  - it: renders when triggerAuth.create and triggerAuth.enabled are both true
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      triggerAuth:
        create: true
        enabled: true
        triggerPodIdentityProvider: azure-workload
        triggerPodIdentityIdentityId: some-identity-id
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: TriggerAuthentication
      - equal:
          path: spec.podIdentity.provider
          value: azure-workload

  - it: is absent when triggerAuth.enabled is false
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      triggerAuth:
        create: true
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: is absent when triggerAuth.create is false
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      triggerAuth:
        create: false
        enabled: true
    asserts:
      - hasDocuments:
          count: 0
