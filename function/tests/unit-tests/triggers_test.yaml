suite: Trigger routing in ScaledJob
templates:
  - templates/ScaledJob.yaml
tests:
  - it: servicebus trigger renders queueName when set
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      scaleType: Job
      triggerAuth:
        create: false
        enabled: false
      triggers:
        - type: azure-servicebus
          queueName: my-queue
          connectionFromEnv: SB_CONN
          messageCount: 5
    asserts:
      - equal:
          path: spec.triggers[0].metadata.queueName
          value: my-queue
      - notExists:
          path: spec.triggers[0].metadata.topicName

  - it: servicebus trigger renders topicName and subscriptionName when queueName not set
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      scaleType: Job
      triggerAuth:
        create: false
        enabled: false
      triggers:
        - type: azure-servicebus
          topicName: my-topic
          subscriptionName: my-subscription
          connectionFromEnv: SB_CONN
          messageCount: 5
    asserts:
      - equal:
          path: spec.triggers[0].metadata.topicName
          value: my-topic
      - equal:
          path: spec.triggers[0].metadata.subscriptionName
          value: my-subscription
      - notExists:
          path: spec.triggers[0].metadata.queueName

  - it: servicebus trigger includes authenticationRef when triggerAuth is enabled
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      scaleType: Job
      triggerAuth:
        create: true
        enabled: true
        triggerPodIdentityProvider: azure-workload
        triggerPodIdentityIdentityId: some-id
        nameOverride: ""
      triggers:
        - type: azure-servicebus
          serviceBusName: my-namespace
          queueName: my-queue
          messageCount: 5
    asserts:
      - exists:
          path: spec.triggers[0].authenticationRef
      - notExists:
          path: spec.triggers[0].metadata.connectionFromEnv

  - it: servicebus trigger uses connectionFromEnv when triggerAuth is disabled
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      scaleType: Job
      triggerAuth:
        create: false
        enabled: false
      triggers:
        - type: azure-servicebus
          queueName: my-queue
          connectionFromEnv: SB_CONN
          messageCount: 5
    asserts:
      - equal:
          path: spec.triggers[0].metadata.connectionFromEnv
          value: SB_CONN
      - notExists:
          path: spec.triggers[0].authenticationRef

  - it: blob trigger renders with blobContainerName
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      scaleType: Job
      triggerAuth:
        create: false
        enabled: false
      triggers:
        - type: azure-blob
          blobContainerName: my-container
          accountName: mystorageaccount
    asserts:
      - equal:
          path: spec.triggers[0].type
          value: azure-blob
      - equal:
          path: spec.triggers[0].metadata.blobContainerName
          value: my-container

  - it: azure-pipelines trigger renders with poolID
    set:
      image: hmctspublic.azurecr.io/test/app:latest
      scaleType: Job
      triggerAuth:
        create: false
        enabled: false
      triggers:
        - type: azure-pipelines
          poolID: "123"
          organizationURLFromEnv: AZP_URL
    asserts:
      - equal:
          path: spec.triggers[0].type
          value: azure-pipelines
      - equal:
          path: spec.triggers[0].metadata.poolID
          value: "123"
