suite: ScaledJob tests
templates:
  - templates/ScaledJob.yaml
tests:
  - it: should render a ScaledJob when scaleType is Job (default)
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledJob
      - isAPIVersion:
          of: keda.sh/v1alpha1

  - it: should not render when scaleType is Object
    set:
      scaleType: Object
    asserts:
      - hasDocuments:
          count: 0

  - it: should name the resource using the release name template
    asserts:
      - equal:
          path: metadata.name
          value: release-name-function

  - it: should propagate polling, history and job settings from values
    set:
      pollingInterval: 45
      maxReplicaCount: 10
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 2
      rollout:
        strategy: immediate
        propagationPolicy: foreground
      job:
        parallelism: 2
        completions: 2
        activeDeadlineSeconds: 300
        backoffLimit: 3
    asserts:
      - equal: { path: spec.pollingInterval, value: 45 }
      - equal: { path: spec.maxReplicaCount, value: 10 }
      - equal: { path: spec.successfulJobsHistoryLimit, value: 3 }
      - equal: { path: spec.failedJobsHistoryLimit, value: 2 }
      - equal: { path: spec.rollout.strategy, value: immediate }
      - equal: { path: spec.rollout.propagationPolicy, value: foreground }
      - equal: { path: spec.jobTargetRef.parallelism, value: 2 }
      - equal: { path: spec.jobTargetRef.completions, value: 2 }
      - equal: { path: spec.jobTargetRef.activeDeadlineSeconds, value: 300 }
      - equal: { path: spec.jobTargetRef.backoffLimit, value: 3 }

  - it: should include scalingStrategy block only when scalingStrategy is accurate
    set:
      scalingStrategy: accurate
    asserts:
      - equal:
          path: spec.scalingStrategy.strategy
          value: accurate

  - it: should omit scalingStrategy block when scalingStrategy is default
    set:
      scalingStrategy: default
    asserts:
      - notExists:
          path: spec.scalingStrategy

  - it: should render one entry in spec.triggers per configured trigger
    set:
      triggers:
        - type: azure-servicebus
          connectionFromEnv: SERVICEBUS_CONNECTIONSTRING
          queueName: test-queue
          messageCount: 5
        - type: azure-blob
          blobContainerName: test-container
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 2
      - equal:
          path: spec.triggers[0].type
          value: azure-servicebus
      - equal:
          path: spec.triggers[1].type
          value: azure-blob

