{{/* metadata for an Azure Service Bus Trigger */}}
{{- define "function.servicebus" }}
- type: azure-servicebus
  metadata:
    {{- if .root.Values.triggerAuth.enabled }}
    namespace: {{ .trigger.serviceBusName | quote }}
    {{- end }}
    {{- if .trigger.queueName }}
    queueName: {{ .trigger.queueName | quote }}
    {{- else }}
    topicName: {{ .trigger.topicName | quote }}
    subscriptionName: {{ .trigger.subscriptionName | quote }}
    {{- end }}
    {{- if not .root.Values.triggerAuth.enabled }}
    connectionFromEnv: {{ .trigger.connectionFromEnv | quote }}
    {{- end }}
    messageCount: {{ .trigger.messageCount | default 5 | quote }}
  {{- if .root.Values.triggerAuth.enabled }}
  authenticationRef:
{{- include "function.trigger-auth-name" .root | indent 4 }}
  {{- end }}
{{- end }}
